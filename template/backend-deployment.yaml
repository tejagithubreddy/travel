{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "travel.fullname" . }}-backend
  labels:
    app: {{ include "travel.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "travel.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "travel.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}"
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: DATABASE_HOST
              value: {{ include "travel.fullname" . }}-postgres
            - name: DATABASE_USER
              value: "{{ .Values.postgres.postgresUser }}"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "travel.fullname" . }}-postgres-secret
                  key: postgres-password
            - name: DATABASE_NAME
              value: "{{ .Values.postgres.postgresDatabase }}"
            - name: NODE_ENV
              value: "{{ .Values.backend.env.NODE_ENV }}"
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "travel.fullname" . }}-backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ include "travel.fullname" . }}-backend
{{- end }}
